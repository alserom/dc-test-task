# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(APP_PRODUCTS_CSV_FILEPATH): '%kernel.project_dir%/products.csv'
    app.products.csv.file_path: '%env(string:APP_PRODUCTS_CSV_FILEPATH)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Shared/Infrastructure/Kernel.php'
            - '../src/Products/Infrastructure/Persistence/Database/Entity'

    App\Products\Domain\Repository\ProductWriteOnlyRepositoryInterface:
        alias: App\Products\Infrastructure\Persistence\Database\Repository\ProductRepository
    App\Products\Domain\Repository\ProductReadOnlyRepositoryInterface:
        alias: App\Products\Infrastructure\Persistence\Database\Repository\ProductRepository
    App\Products\Domain\Repository\ProductRepositoryInterface:
        alias: App\Products\Infrastructure\Persistence\Database\Repository\ProductRepository
        
    App\Products\UI\CLI\ProductsImportCommand:
        arguments:
            - '@App\Shared\Application\Command\CommandBusInterface'
            - '@lock.default.factory'
            - '@App\Products\Infrastructure\Service\ProductImport\Rozetka\Parser'

    app.products.csv.writer:
        class: App\Shared\Infrastructure\Persistence\CSV\LeagueCsvWriter
        arguments:
            - '%app.products.csv.file_path%'
            - 'a+'
                
    App\Products\Infrastructure\Persistence\CSV\Repository\ProductRepository:
        arguments:
            - '@app.products.csv.writer'

    _instanceof:
        App\Shared\Application\Command\CommandHandlerInterface:
            tags:
                - { name: messenger.message_handler, bus: command.bus }

        App\Shared\Application\Query\QueryHandlerInterface:
            tags:
                - { name: messenger.message_handler, bus: query.bus }
        
        App\Shared\Application\Event\EventHandlerInterface:
            tags:
                - { name: messenger.message_handler, bus: event.bus }
